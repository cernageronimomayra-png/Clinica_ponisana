<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Poni Sana</title>
    <!-- Google Fonts para tipografía profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <!-- Encabezado y Navegación -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="brand">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Clínica Poni Sana" class="logo-img">
                <div class="brand-text">
                    <span class="brand-title">CLÍNICA PONI SANA</span>
                    <span class="brand-tagline">Salud e Integridad</span>
                </div>
            </div>

            <nav class="nav-links">
                <a href="{{ url_for('paciente.index') }}">Pacientes</a>
                <a href="{{ url_for('medicos.index') }}">Médicos</a>
                <a href="{{ url_for('consulta.index') }}">Consultas</a>
                <a href="{{ url_for('tratamientos.index') }}">Tratamientos</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="footer">
        <p>&copy; 2026 Clínica Poni Sana — Salud e Integridad. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
