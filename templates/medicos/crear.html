{% extends 'layout.html' %}

{% block content %}
<h2>Registrar Médico</h2>
<form action="{{ url_for('medicos.crear') }}" method="POST">
    <label>Nombre:</label><br>
    <input type="text" name="nombre" required><br><br>

    <label>Especialidad:</label><br>
    <input type="text" name="especialidad" required><br><br>

    <label>Horario:</label><br>
    <input type="text" name="horario" required><br><br>

    <button type="submit">Guardar Médico</button>
    <a href="{{ url_for('medicos.index') }}">Cancelar</a>
</form>
{% endblock %}
