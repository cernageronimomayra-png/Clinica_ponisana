{% extends 'layout.html' %}

{% block content %}
<h2>Listado de Médicos</h2>
<a href="{{ url_for('medicos.crear') }}">Registrar Nuevo Médico</a>
<br><br>
<table class="table">
    <thead>
        <tr>
            <th>#</th>
            <th>NOMBRE</th>
            <th>ESPECIALIDAD</th>
            <th>HORARIO</th>
            <th>ACCIONES</th>
        </tr>
    </thead>
    <tbody>
        <!-- El bucle DEBE empezar AQUÍ, justo antes del <tr> -->
        {% for m in medicos %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ m.nombre }}</td>
            <td>{{ m.especialidad }}</td>
            <td>{{ m.horario }}</td>
            <td>
                <a href="{{ url_for('medicos.editar', id=m.id_medico) }}">Editar</a>
                <form action="{{ url_for('medicos.eliminar', id=m.id_medico) }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('¿Desea eliminar este médico?')">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %} <!-- El bucle DEBE terminar AQUÍ, justo después del </tr> -->
    </tbody>
</table>
{% endblock %}
