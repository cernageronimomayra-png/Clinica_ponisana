{% extends 'layout.html' %}

{% block content %}
<h2>Listado de Médicos</h2>
<a href="{{ url_for('medicos.crear') }}">Registrar Nuevo Médico</a>
<br><br>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>ESPECIALIDAD</th>
            <th>HORARIO</th>
            <th>ACCIONES</th>
        </tr>
    </thead>
    <tbody>
        {% for m in medicos %}
        <tr>
            <td>{{ m.id_medico }}</td>
            <td>{{ m.nombre }}</td>
            <td>{{ m.especialidad }}</td>
            <td>{{ m.horario }}</td>
            <td style="display: flex; align-items: center; gap: 8px;">
                <a href="{{ url_for('medicos.editar', id=m.id_medico) }}">Editar</a>

                <form action="{{ url_for('medicos.eliminar', id=m.id_medico) }}" method="POST" style="margin: 0; display: inline;">
                    <button type="submit" onclick="return confirm('¿Desea eliminar este médico?')">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
