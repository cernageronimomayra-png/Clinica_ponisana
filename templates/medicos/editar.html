{% extends 'layout.html' %}

{% block content %}
<h2>Editar Médico</h2>
<form action="{{ url_for('medicos.editar', id=medico.id_medico) }}" method="POST">
    <label>Nombre:</label><br>
    <input type="text" name="nombre" value="{{ medico.nombre }}" required><br><br>
    
    <label>Especialidad:</label><br>
    <input type="text" name="especialidad" value="{{ medico.especialidad }}" required><br><br>
    
    <label>Teléfono:</label><br>
    <input type="text" name="telefono" value="{{ medico.telefono }}" required><br><br>
    
    <label>Email:</label><br>
    <input type="email" name="email" value="{{ medico.email }}" required><br><br>
    
    <button type="submit">Actualizar Médico</button>
    <a href="{{ url_for('medicos.index') }}">Cancelar</a>
</form>
{% endblock %}
