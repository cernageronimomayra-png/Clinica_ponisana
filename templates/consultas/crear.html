{% extends 'layout.html' %}

{% block content %}
<h2>Agendar Consulta</h2>

<form action="{{ url_for('consulta.crear') }}" method="POST">
    <label for="fecha">Fecha:</label><br>
    <input type="date" name="fecha" required><br><br>

    <label for="hora">Hora:</label><br>
    <input type="time" name="hora" required><br><br>

    <label for="motivo">Motivo:</label><br>
    <input type="text" name="motivo" required><br><br>

    <label for="id_paciente">Paciente:</label><br>
    <select name="id_paciente" required>
        <option value="">-- Seleccione un Paciente --</option>
        {% for p in pacientes %}
            <option value="{{ p.id_paciente }}">{{ p.nombre }} - RUT: {{ p.rut }}</option>
        {% endfor %}
    </select><br><br>

    <label for="id_medico">Médico:</label><br>
    <select name="id_medico" required>
        <option value="">-- Seleccione un Médico --</option>
        {% for m in medicos %}
            <option value="{{ m.id_medico }}">{{ m.nombre }} ({{ m.especialidad }})</option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Guardar Consulta</button>
    <a href="{{ url_for('consulta.index') }}">Cancelar</a>
</form>
{% endblock %}
