{% extends 'layout.html' %}

{% block content %}
<h2>Registrar Tratamiento</h2>
<form action="{{ url_for('tratamientos.crear') }}" method="POST">
    <!-- Campo Nombre -->
    <label>Nombre del Tratamiento:</label><br>
    <input type="text" name="nombre" required><br><br>

    <!-- Campo Dosis -->
    <label>Dosis:</label><br>
    <input type="text" name="dosis" required><br><br>

    <!-- Campo Duración -->
    <label>Duración:</label><br>
    <input type="text" name="duracion" required><br><br>

    <button type="submit">Guardar Tratamiento</button>
    <a href="{{ url_for('tratamientos.index') }}">Cancelar</a>
</form>
{% endblock %}
