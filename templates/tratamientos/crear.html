{% extends 'layout.html' %}

{% block content %}
<h2>Registrar Tratamiento</h2>
<form action="{{ url_for('tratamiento.crear') }}" method="POST">
    <label>Descripción:</label><br>
    <input type="text" name="descripcion" required><br><br>

    <label>Costo:</label><br>
    <input type="number" step="0.01" name="costo" required><br><br>

    <label>ID Consulta:</label><br>
    <input type="number" name="id_consulta" required><br><br>

    <button type="submit">Guardar Tratamiento</button>
    <a href="{{ url_for('tratamiento.index') }}">Cancelar</a>
</form>
{% endblock %}
