{% extends 'layout.html' %}

{% block content %}
<h2>Editar Tratamiento</h2>
<form action="{{ url_for('tratamientos.editar', id=tratamiento.id_tratamiento) }}" method="POST">
    <label for="nombre">Nombre:</label>
    <input type="text" name="nombre" value="{{ tratamiento.nombre }}" required>

    <label for="dosis">Dosis:</label>
    <input type="text" name="dosis" value="{{ tratamiento.dosis }}" required>

    <label for="duracion">Duración:</label>
    <input type="text" name="duracion" value="{{ tratamiento.duracion }}" required>

    <button type="submit">Guardar Cambios</button>
    <a href="{{ url_for('tratamientos.index') }}">Cancelar</a>
</form>
{% endblock %}
