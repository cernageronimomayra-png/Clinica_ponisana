{% extends 'layout.html' %}

{% block content %}
<h2>Editar Tratamiento</h2>
<form action="{{ url_for('tratamiento.editar', id=tratamiento.id_tratamiento) }}" method="POST">
    <label>Descripción:</label><br>
    <input type="text" name="descripcion" value="{{ tratamiento.descripcion }}" required><br><br>

    <label>Costo:</label><br>
    <input type="number" step="0.01" name="costo" value="{{ tratamiento.costo }}" required><br><br>

    <label>ID Consulta:</label><br>
    <input type="number" name="id_consulta" value="{{ tratamiento.id_consulta }}" required><br><br>

    <button type="submit">Actualizar Tratamiento</button>
    <a href="{{ url_for('tratamiento.index') }}">Cancelar</a>
</form>
{% endblock %}
